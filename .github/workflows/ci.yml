name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Core + tests target net8.0 and run anywhere. The app's Apple targets are only part
  # of the build on macOS (see WorkoutTracker.csproj), so no Xcode-bearing runner is
  # needed for either job.
  core-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: >
          dotnet test WorkoutTracker.Tests/WorkoutTracker.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx

  maui-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pinned to the SDK the project is known to build with locally; floating 8.0.x
          # picks up newer workload manifests whose support notices failed the build.
          dotnet-version: '8.0.420'

      # Only the Windows head is built here, so only its workload is installed. The
      # build selects that head explicitly; leaving the others in the target list makes
      # restore demand their workloads too, and the Android one reports as an error.
      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build Windows app
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'build.log'
          dotnet build WorkoutTracker/WorkoutTracker.csproj `
            --configuration Release `
            -f net8.0-windows10.0.19041.0 `
            -p:MauiTargetFrameworks=net8.0-windows10.0.19041.0 `
            --verbosity normal 2>&1 | Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
            # Job logs need authentication to read from automation, so the actual
            # failure is re-emitted as annotations where it can be seen.
            Select-String -Path $log -Pattern ': error ' | Select-Object -First 5 | ForEach-Object {
              Write-Host "::error file=.github/workflows/ci.yml::$($_.Line.Trim())"
            }
            exit 1
          }
